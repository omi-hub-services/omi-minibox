schema_version: 1
repository:
  owner: omi-hub-services
  name: omi-minibox
project:
  owner: omi-hub-services
  number: 5
branches:
  integration: develop
  release: main
limits:
  max_parallel_workers: 2
  step_timeout_seconds: 1800
  max_rework_cycles: 2
effort_policy:
  low: low
  medium: medium
  high: high
resource_wait:
  interval_ms: 1000
  max_backoff_ms: 60000
policies:
  mandatory_approvals:
    - release
    - deploy
  github_approval_actors:
    - ttin-omihub
